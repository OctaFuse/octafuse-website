# Cloudflare Pages：与 octafuse-gateway 解耦；`pages deploy` / Dashboard 托管均使用 dist/。
# account_id 可写在 Cloudflare 项目设置中；若仅用 GitHub Actions 部署，在仓库 Secrets 提供 CLOUDFLARE_ACCOUNT_ID 即可。
name = "octafuse-website"
compatibility_date = "2026-07-25"
pages_build_output_dir = "dist"

[[ratelimits]]
name = "CATALOG_RATE_LIMITER"
namespace_id = "2026072501"

	[ratelimits.simple]
	limit = 10
	period = 60
